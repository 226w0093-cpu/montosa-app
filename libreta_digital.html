<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montosa - Libreta Digital Taller</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        :root {
            --montosa-rojo: #C8102E;
            --montosa-rojo-oscuro: #9B0920;
        }
        body {
            background-color: #F4F6F9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-bottom: 30px;
        }
        .header-app {
            background-color: var(--montosa-rojo);
            color: white;
            padding: 15px;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .btn-montosa {
            background-color: var(--montosa-rojo);
            color: white;
            border: none;
            font-weight: bold;
        }
        .btn-montosa:hover, .btn-montosa:active {
            background-color: var(--montosa-rojo-oscuro);
            color: white;
        }
        .card-custom {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header-app text-center mb-3">
        <div class="bg-white d-inline-block px-3 py-1 rounded-3 shadow-sm mb-2">
            <img src="img/logo_montosa.png" alt="Montosa Logo" height="35">
        </div>
        <h6 class="m-0 fw-bold"><i class="bi bi-journal-bookmark-fill me-1"></i> LIBRETA DIGITAL DE MOVIMIENTOS</h6>
    </div>

    <div class="container px-3">

        <!-- Formulario de Bitácora -->
        <form id="formBitacora" class="card card-custom p-3">
            <h6 class="fw-bold text-danger mb-3 border-bottom pb-2">
                <i class="bi bi-arrow-down-up me-1"></i> Registro de Entrada / Salida
            </h6>

            <!-- Tipo de Movimiento -->
            <div class="mb-3">
                <label class="form-label fw-semibold small">TIPO DE MOVIMIENTO (*)</label>
                <div class="row g-2">
                    <div class="col-6">
                        <input type="radio" class="btn-check" name="tipo_movimiento" id="mov_entrada" value="ENTRADA" checked>
                        <label class="btn btn-outline-success w-100 fw-bold py-2" for="mov_entrada">
                            <i class="bi bi-box-arrow-in-down me-1"></i> ENTRADA
                        </label>
                    </div>
                    <div class="col-6">
                        <input type="radio" class="btn-check" name="tipo_movimiento" id="mov_salida" value="SALIDA">
                        <label class="btn btn-outline-danger w-100 fw-bold py-2" for="mov_salida">
                            <i class="bi bi-box-arrow-up me-1"></i> SALIDA
                        </label>
                    </div>
                </div>
            </div>

            <!-- Datos del Equipo -->
            <div class="mb-3">
                <label class="form-label fw-semibold small">NÚMERO DE SERIE (*)</label>
                <input type="text" id="numero_serie" class="form-control form-control-lg text-uppercase" placeholder="Ej: F13224564645" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold small">MODELO / COMPAÑÍA</label>
                <input type="text" id="modelo" class="form-control" placeholder="Ej: VR, CCV, CBH">
            </div>

            <!-- Datos del Traslado -->
            <div class="mb-3">
                <label class="form-label fw-semibold small">CLIENTE / ID CLIENTE</label>
                <input type="text" id="cliente_id" class="form-control" placeholder="Ej: 302546346, 712343">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold small">ORIGEN / DESTINO</label>
                <input type="text" id="origen_destino" class="form-control" placeholder="Ej: Comodatar, Almacén, Abarrotes">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold small">RESPONSABLE / CHÓFER (*)</label>
                <input type="text" id="responsable_traslado" class="form-control" placeholder="Ej: Jefe de Area, Chofer" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold small">OBSERVACIONES</label>
                <textarea id="observaciones" class="form-control" rows="2" placeholder="Detalles del equipo..."></textarea>
            </div>

            <!-- Botón de Envío -->
            <button type="submit" class="btn btn-montosa btn-lg w-100 py-3 shadow" id="btnGuardarBitacora">
                <i class="bi bi-cloud-arrow-up-fill me-1"></i> REGISTRAR MOVIMIENTO
            </button>
        </form>

        <div id="mensajeRespuesta" class="mt-3"></div>

    </div>

    <!-- Script de Lógica -->
    <script>
        document.getElementById('formBitacora').addEventListener('submit', function(e) {
            e.preventDefault();

            const btn = document.getElementById('btnGuardarBitacora');
            const mensaje = document.getElementById('mensajeRespuesta');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Guardando...';

            const tipoMovimiento = document.querySelector('input[name="tipo_movimiento"]:checked').value;

            const payload = {
                accion: "bitacora",
                tipo_movimiento: tipoMovimiento,
                numero_serie: document.getElementById('numero_serie').value.trim(),
                modelo: document.getElementById('modelo').value.trim(),
                cliente_id: document.getElementById('cliente_id').value.trim(),
                origen_destino: document.getElementById('origen_destino').value.trim(),
                responsable_traslado: document.getElementById('responsable_traslado').value.trim(),
                observaciones: document.getElementById('observaciones').value.trim(),
                id_usuario_tecnico: 1
            };

            fetch('../sync.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-cloud-arrow-up-fill me-1"></i> REGISTRAR MOVIMIENTO';

                if (data.status === 'success') {
                    mensaje.innerHTML = `<div class="alert alert-success"><i class="bi bi-check-circle me-1"></i> ${data.message}</div>`;
                    document.getElementById('formBitacora').reset();
                } else {
                    mensaje.innerHTML = `<div class="alert alert-danger"><i class="bi bi-exclamation-triangle me-1"></i> ${data.message}</div>`;
                }
            })
            .catch(err => {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-cloud-arrow-up-fill me-1"></i> REGISTRAR MOVIMIENTO';
                mensaje.innerHTML = `<div class="alert alert-danger"><i class="bi bi-wifi-off me-1"></i> Error de conexión con el servidor.</div>`;
            });
        });
    </script>
</body>
</html>
